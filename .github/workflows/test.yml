name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          if grep -q 'rustune-aarch64-linux' Formula/rustune.rb; then
            echo 'os=["macos-latest","ubuntu-latest","ubuntu-24.04-arm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["macos-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  install:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          dirname "$(command -v brew)" >> "$GITHUB_PATH"

      - name: Tap checked-out commit
        run: |
          git -C "$GITHUB_WORKSPACE" checkout -B main
          brew tap dzulfikar08/tap "$GITHUB_WORKSPACE"

      - name: Style
        run: brew style dzulfikar08/tap/rustune

      - name: Install
        run: brew install dzulfikar08/tap/rustune

      - name: Run
        run: |
          rustune --version
          rustune --version | grep -F "rustune $(brew info --json=v2 dzulfikar08/tap/rustune | jq -r '.formulae[0].versions.stable')"

      - name: Check libasound resolves to Homebrew alsa-lib
        if: runner.os == 'Linux'
        run: |
          bin="$(brew --prefix rustune)/bin/rustune"
          patchelf --print-rpath "$(readlink -f "$bin")" || true
          ldd "$bin"
          ldd "$bin" | grep -E 'libasound\.so\.2 => .*linuxbrew.*alsa-lib'

      - name: Test
        run: brew test dzulfikar08/tap/rustune

      - name: Audit
        run: brew audit --strict --online dzulfikar08/tap/rustune
