name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate formula
        run: ./scripts/update-formula.sh

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- Formula/rustune.rb; then
            echo "Formula already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/rustune.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rustune.rb
          git commit -m "chore: rustune ${version}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger test workflow
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run test.yml --ref main --repo "$GITHUB_REPOSITORY"
